name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x86 Release
        run: cmake -S . -B build -A Win32
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf-config-windows-x86
          path: build/Release/rF Config.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' 'build/Release/rF Config.exe' --generate-notes
